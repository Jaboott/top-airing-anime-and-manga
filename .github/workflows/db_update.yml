name: Pre-Cache Website

on:
  schedule:
    - cron: "0 0 * * *"  # Runs once a day at midnight
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run pre-cache for airing anime
        run: |
          curl -f https://topanime.jaboott.com/anime?airing

      - name: Run pre-cache for anime
        run: |
          curl -f https://topanime.jaboott.com/anime

      - name: Run pre-cache for airing manga
        run: |
          curl -f https://topanime.jaboott.com/manga?airing

      - name: Run pre-cache for manga
        run: |
          curl -f https://topanime.jaboott.com/manga